name: Ofertas Mineria a Telegram

on:
  schedule:
    - cron: "0 11 * * *"   # todos los días a las 08:00 hora de Chile (verano)
    - cron: "0 21 * * *"   # y a las 18:00 hora de Chile
  workflow_dispatch:        # permite ejecutarlo a mano con el botón "Run workflow"

permissions:
  contents: write           # para guardar el historial de ofertas enviadas

jobs:
  buscar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install requests beautifulsoup4

      - name: Buscar ofertas y enviar a Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python buscador_ofertas_telegram.py

      - name: Guardar historial (para no repetir ofertas)
        run: |
          git config user.name "bot-ofertas"
          git config user.email "bot-ofertas@users.noreply.github.com"
          git add ofertas_enviadas.json || true
          git diff --cached --quiet || git commit -m "Actualizar historial de ofertas"
          git pull --rebase || true
          git push
